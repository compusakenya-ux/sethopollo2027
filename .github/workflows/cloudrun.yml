name: Deploy to Cloud Run

on:
  push:
    branches:
      - main  # Triggers deployment automatically on every push to main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: africa-south1 # Change to your preferred GCP region (e.g., europe-west1)
  SERVICE_NAME: sethopollo2027  # Replace with your Cloud Run service name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_URL="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t $IMAGE_URL .
          docker push $IMAGE_URL
          echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_URL }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars VERIFY_TOKEN="${{ secrets.WHATSAPP_VERIFY_TOKEN }}",PHONE_ID="${{ secrets.WHATSAPP_PHONE_ID }}"
